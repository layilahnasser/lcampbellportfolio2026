<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock-up: ball options</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
.bo{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.bo h1{font-family:Damion,cursive;font-weight:400;font-size:46px;color:#fff;text-shadow:0 0 16px #ff2fb4;margin:6px 0 4px}
.bo-badge{display:inline-block;background:#ffd24a;color:#1a1200;font-weight:700;border-radius:999px;padding:4px 12px;font-size:13px}
.bo-lab{margin:26px 0 10px;color:#4de3ff;font-weight:700;letter-spacing:.1em;font-size:14px}
.bo-lab span{color:#cfc8e6;font-weight:500;letter-spacing:0;margin-left:8px}
.bo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.c{--c:#ff5a3c;position:relative;background:var(--panel);border:2px solid #2b2443;border-radius:18px;overflow:visible;display:flex;flex-direction:column}
.c .im{height:150px;border-radius:16px 16px 0 0;overflow:hidden;background:#120f1c}
.c .im img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.c .im.ct img{object-fit:contain}
.c .bd{padding:16px 18px 18px}
.c .ey{font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--c)}
.c h3{margin:4px 0 4px;font-size:22px;color:#fff}
.c p{margin:0;color:#d8d2ec;font-size:15px}
.ball{display:block;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff9 0 6%,transparent 18%),radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 8px 14px #0009;position:relative;flex:none}
.ball i{position:absolute;width:13%;height:13%;border-radius:50%;background:#150f26;box-shadow:inset 0 1px 2px #000}
.ball i:nth-child(1){left:36%;top:28%}.ball i:nth-child(2){left:54%;top:24%}.ball i:nth-child(3){left:46%;top:46%}
/* A: on the edge, straddling image and text */
.A .ball{position:absolute;left:18px;top:136px;width:58px;height:58px;z-index:2}
.A .bd{padding-top:44px}
/* B: ball is the lane number */
.B .hd{display:flex;align-items:center;gap:12px}
.B .ball{width:46px;height:46px}
.B .ball b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;color:#0009;font-weight:700;padding-top:10px}
.B .hd h3{margin:0}
.B .hd small{display:block;font-weight:700;letter-spacing:.12em;font-size:12px;color:var(--c)}
/* C: ball on its own lane strip */
.lanes{display:flex;align-items:center;gap:0;height:46px;margin:0;background:linear-gradient(#d9a45a,#b9803a);border-top:3px solid var(--c);border-bottom:3px solid #0006;position:relative;overflow:hidden}
.lanes .ball{width:34px;height:34px;margin-left:10px;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.lanes .pn{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:3px}
.lanes .pn s{width:7px;height:20px;border-radius:4px 4px 6px 6px;background:#fff;border-top:5px solid #e5392d;display:block}
.C:hover .ball{transform:translateX(calc(min(30vw,300px)))}
@media(max-width:800px){.bo-row{grid-template-columns:1fr}}
</style></head><body>
<main class="bo">
<span class="bo-badge">MOCK-UP · three ways to show the balls</span>
<h1>Ball options</h1>
<script>
const P=[["Milk and Froth Redesign","#ff5a3c","../assets/img/milk-homepage.jpg","A website redesign concept for a Detroit ice cream brand.",1,""],["Crown Code","#c6f24a","../assets/img/crown-cover.png","A mobile app that brings interview prep into one place.",2,"ct"],["Root Insurance","#ff7a45","../assets/img/root-final-shareout.jpg","Improving retention for 500,000+ policyholders.",3,""]];
const dots='<i></i><i></i><i></i>';
const card=(p,v)=>{const [t,c,im,s,n,ct]=p;const img=`<div class="im ${ct}"><img src="${im}" alt=""></div>`;
if(v=='A')return `<div class="c A" style="--c:${c}">${img}<span class="ball">${dots}</span><div class="bd"><div class="ey">LANE ${n} · 2026</div><h3>${t}</h3><p>${s}</p></div></div>`;
if(v=='B')return `<div class="c B" style="--c:${c}">${img}<div class="bd"><div class="hd"><span class="ball">${dots}<b>${n}</b></span><div><small>LANE ${n} · 2026</small><h3>${t}</h3></div></div><p style="margin-top:8px">${s}</p></div></div>`;
return `<div class="c C" style="--c:${c}">${img}<div class="lanes"><span class="ball">${dots}</span><span class="pn">${'<s></s>'.repeat(4)}</span></div><div class="bd"><div class="ey">LANE ${n} · 2026</div><h3>${t}</h3><p>${s}</p></div></div>`};
const sect=(v,name,desc)=>document.write(`<div class="bo-lab">${v}. ${name}<span>${desc}</span></div><div class="bo-row">${P.map(p=>card(p,v)).join('')}</div>`);
sect('A','Ball on the edge','sits on the seam between picture and text, so it never covers the screenshot');
sect('B','Ball is the lane number','the number lives on the ball, next to the title');
sect('C','Ball on its lane','a small wooden lane strip; hover and the ball rolls toward the pins');
</script>
</main></body></html>
